[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finevidence-copilot"
version = "0.1.0"
description = "Evidence-grounded financial QA and chart specification learning prototype."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.32,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
llm = ["langchain-openai>=1,<2"]
docs = ["Markdown>=3.7,<4"]

[project.scripts]
finevidence = "finevidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finevidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
