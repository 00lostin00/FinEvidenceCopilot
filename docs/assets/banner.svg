<path d="M45 86H1155M45 90H1155" stroke="#80928e"/><text x="45" y="119" fill="#657d74" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13">研究问题：青禾科技 2025 年营业收入同比是多少？</text>
<g font-family="Georgia,serif" fill="#27444e"><text x="45" y="194" font-size="42">12,000</text><text x="440" y="194" font-size="42">15,000</text><text x="835" y="194" font-size="42">+25.00%</text></g>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#7b8980" font-size="12"><text x="45" y="224">2024 年 / 营业收入（万元）</text><text x="440" y="224">2025 年 / 营业收入（万元）</text><text x="835" y="224">同比 / (15000 - 12000) ÷ 12000</text></g>
